<!doctype html>
<meta charset="utf-8"><title>banc paiement</title>
<style>
  body{margin:0;background:#FBF9F5;font-family:"DM Sans",system-ui,sans-serif;color:#1A1A18}
  .col{width:min(347px,calc(100% - 28px));margin:0 auto;padding:18px 0 30px}
  @media (min-width:750px){.col{width:min(560px,calc(100% - 64px))}}
  .vrl-buy-now{display:flex;width:100%;min-height:54px;align-items:center;justify-content:center;
    padding:14px 22px;border:1px solid #A85C2A;border-radius:2px;color:#FBF9F5;background:#A85C2A;
    font-size:15px;font-weight:700;letter-spacing:.025em}
  .vrl-buy-now-status{min-height:0;margin:0;color:#5C5C55;font:12px/1.45 "DM Sans",system-ui,sans-serif;text-align:center}
  .vrl-buy-now-status:not(:empty){margin:7px 0 2px}
  .vrl-main-trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:18px 0 10px;
    border-top:1px solid rgba(31,61,43,.16);color:#1F3D2B;font-size:12px;font-weight:700;text-align:center}
  .vrl-main-trust a,.vrl-main-trust span{display:flex;min-height:38px;align-items:center;justify-content:center;padding:4px;color:inherit;text-decoration:none}
  @media (max-width:749px){
    .vrl-main-trust{grid-template-columns:1fr;gap:2px;text-align:left}
    .vrl-main-trust a,.vrl-main-trust span{justify-content:flex-start;min-height:30px}
  }

  /* ==== EXACTEMENT LE CSS LIVRE ==== */
  .vrl-payment-panel { margin-top: 11px; padding: 12px 0 14px; border-top: 1px solid rgba(31,61,43,.12); }
  .vrl-payment-panel__label { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 11px; color: #6B7A70; font: 600 10px/1 "DM Sans", system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
  .vrl-payment-panel__label svg { flex-shrink: 0; }
  .vrl-main-payments { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .vrl-main-payments li { display: flex; }
  .vrl-main-payments svg { display: block; width: 30px; height: auto; border-radius: 3px; }
  @media (min-width: 750px) {
    .vrl-main-payments { gap: 7px; }
    .vrl-main-payments svg { width: 33px; }
  }
  @media (max-width: 749px) { .vrl-payment-panel { margin-top: 9px; } }
</style>
<div class="col">
  <button class="vrl-buy-now">Acheter maintenant</button>
  <p class="vrl-buy-now-status"></p>
  <div class="vrl-payment-panel" id="panel">
    <span class="vrl-payment-panel__label"><svg width='10' height='12' viewBox='0 0 10 12' fill='none' aria-hidden='true'><path d='M2 5V3.5a3 3 0 0 1 6 0V5' stroke='currentColor' stroke-width='1.3'/><rect x='1' y='5' width='8' height='6.2' rx='1.4' fill='currentColor'/></svg>Paiement sécurisé</span>
    <ul class="vrl-main-payments">
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#006FCF' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#FFFFFF'>AMEX</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#FFFFFF' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#000000'>Pay</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#FFFFFF' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#C8102E'>CB</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#FFB3C7' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#0B051D'>Klarna</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#231F20' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#FF5F00'>MC</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#FFFFFF' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#003087'>PayPal</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#5A31F4' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#FFFFFF'>shop</text></svg></li>
        <li><svg viewBox='0 0 38 24' xmlns='http://www.w3.org/2000/svg'><rect x='.5' y='.5' width='37' height='23' rx='3' fill='#1434CB' stroke='rgba(0,0,0,.14)'/><text x='19' y='15.5' font-family='Helvetica,Arial' font-size='6.5' font-weight='700' text-anchor='middle' fill='#FFFFFF'>VISA</text></svg></li>
    </ul>
  </div>
  <div class="vrl-main-trust">
    <a href="#">Livraison détaillée avant paiement</a>
    <a href="#">Retours selon les conditions</a>
    <span>Commande protégée</span>
  </div>
</div>
