name: cart-check
on:
  push:
    paths: ['.github/workflows/cart-check.yml']
  workflow_dispatch:

jobs:
  panier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.48.0
      - run: npx playwright install --with-deps webkit
      - name: Cliquer Ajouter au panier et observer la requete
        run: |
          cat > cart.js <<'JS'
          const { webkit } = require('playwright');
          const URL = 'https://kznquq-5a.myshopify.com/products/gel-lavant-purifiant-pieds-tea-tree';
          (async () => {
            const b = await webkit.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
              viewport: { width: 390, height: 844 }, hasTouch: true,
              locale: 'fr-FR', timezoneId: 'Europe/Paris',
            });
            const p = await ctx.newPage();

            p.on('request', r => {
              if (r.url().includes('/cart/add')) {
                console.log('>> REQUETE', r.method(), r.url());
                console.log('>> CORPS  ', (r.postData() || '(vide)').slice(0, 400));
              }
            });
            p.on('response', async r => {
              if (r.url().includes('/cart/add')) {
                console.log('<< REPONSE', r.status());
                try { console.log('<< CORPS  ', (await r.text()).slice(0, 600)); } catch (e) {}
              }
            });

            await p.goto(URL, { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(6000);

            const avant = await p.evaluate(() => {
              const out = [];
              document.querySelectorAll('form[action*="/cart/add"]').forEach(f => {
                const c = f.querySelector('input[name="id"]');
                out.push({ formId: f.id || '(sans id)', valeur: c ? String(c.value) : '(pas de champ id)' });
              });
              return out;
            });
            console.log('CHAMPS id AVANT CLIC :', JSON.stringify(avant, null, 1));

            const btn = await p.$('[id^="ProductSubmitButton-"], .main-product-atc');
            if (!btn) { console.log('AUCUN BOUTON'); await b.close(); return; }
            console.log('LIBELLE BOUTON :', (await btn.innerText()).trim());
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ force: true });
            await p.waitForTimeout(7000);

            const apres = await p.evaluate(() => {
              const err = document.querySelector('.product-form__error-message');
              const wrap = document.querySelector('.product-form__error-message-wrapper');
              const champs = [];
              document.querySelectorAll('form[action*="/cart/add"]').forEach(f => {
                const c = f.querySelector('input[name="id"]');
                champs.push({ formId: f.id || '(sans id)', valeur: c ? String(c.value) : '(pas de champ id)' });
              });
              return {
                erreurTexte: err ? err.textContent.trim() : '(pas d element erreur)',
                erreurAffichee: wrap ? !wrap.hasAttribute('hidden') : null,
                champs,
              };
            });
            console.log('APRES CLIC :', JSON.stringify(apres, null, 1));

            const panier = await p.evaluate(async () => {
              const r = await fetch('/cart.js', { headers: { 'Accept': 'application/json' } });
              const j = await r.json();
              return { articles: j.item_count, lignes: (j.items || []).map(i => i.title + ' x' + i.quantity) };
            });
            console.log('ETAT DU PANIER :', JSON.stringify(panier));
            await b.close();
          })();
          JS
          node cart.js
