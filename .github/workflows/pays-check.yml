name: pays-check
on:
  push:
    paths: ['.github/workflows/pays-check.yml']
  workflow_dispatch:

jobs:
  pays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.48.0
      - run: npx playwright install --with-deps webkit
      - name: Ajout au panier en contexte France puis Etats-Unis
        run: |
          cat > pays.js <<'JS'
          const { webkit } = require('playwright');
          const BASE = 'https://kznquq-5a.myshopify.com';
          const PROD = BASE + '/products/gel-lavant-purifiant-pieds-tea-tree';

          async function essai(b, pays) {
            console.log('\n' + '='.repeat(64));
            console.log('CONTEXTE PAYS :', pays || 'par defaut (IP du runner, Etats-Unis)');
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
              viewport: { width: 390, height: 844 }, hasTouch: true,
              locale: 'fr-FR', timezoneId: 'Europe/Paris',
              extraHTTPHeaders: { 'Accept-Language': 'fr-FR,fr;q=0.9' },
            });
            const p = await ctx.newPage();
            const reps = [];
            p.on('response', async r => {
              if (r.url().includes('/cart/add')) {
                let t = ''; try { t = (await r.text()).slice(0, 400); } catch (e) {}
                reps.push(r.status() + ' :: ' + t);
              }
            });

            await p.goto(PROD, { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(3000);

            if (pays) {
              // On bascule la session dans le marche du pays demande.
              const ok = await p.evaluate(async (code) => {
                const fd = new FormData();
                fd.append('form_type', 'localization');
                fd.append('utf8', '✓');
                fd.append('_method', 'put');
                fd.append('country_code', code);
                fd.append('return_to', location.pathname);
                const r = await fetch('/localization', { method: 'POST', body: fd, redirect: 'follow' });
                return r.status;
              }, pays);
              console.log('  bascule /localization ->', ok);
              await p.goto(PROD, { waitUntil: 'load', timeout: 60000 });
              await p.waitForTimeout(4000);
            }

            const devise = await p.evaluate(async () => {
              const r = await fetch('/cart.js', { headers: { Accept: 'application/json' } });
              const j = await r.json();
              return j.currency;
            });
            console.log('  devise du panier :', devise);

            const btn = await p.$('[id^="ProductSubmitButton-"], .main-product-atc');
            console.log('  libelle bouton   :', btn ? (await btn.innerText()).trim().replace(/\s+/g,' ') : '(aucun)');
            if (btn) { await btn.scrollIntoViewIfNeeded(); await btn.click({ force: true }); }
            await p.waitForTimeout(7000);

            const fin = await p.evaluate(() => {
              const w = document.querySelector('.product-form__error-message-wrapper');
              const e = document.querySelector('.product-form__error-message');
              return { visible: w ? !w.hasAttribute('hidden') : null, texte: e ? e.textContent.trim() : '' };
            });
            let panier = { item_count: 0 };
            try {
              const r = await ctx.request.get(BASE + '/cart.js', { headers: { Accept: 'application/json' } });
              panier = await r.json();
            } catch (e) {}
            console.log('  REPONSE /cart/add :', reps.join(' | ') || '(aucune requete)');
            console.log('  ERREUR AFFICHEE   :', fin.visible ? '"' + fin.texte + '"' : 'aucune');
            console.log('  PANIER            :', panier.item_count, 'article(s)');
            console.log('  VERDICT           :', panier.item_count > 0 ? 'OK' : 'ECHEC');
            await ctx.close();
          }

          (async () => {
            const b = await webkit.launch();
            await essai(b, null);
            await essai(b, 'FR');
            await essai(b, 'US');
            await b.close();
          })();
          JS
          node pays.js
