name: achat-check
on:
  push:
    paths: ['.github/workflows/achat-check.yml']
  workflow_dispatch:

jobs:
  achat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.48.0
      - run: npx playwright install --with-deps webkit
      - name: Parcours d achat complet
        run: |
          cat > achat.js <<'JS'
          const { webkit } = require('playwright');
          const PRODUIT = 'https://kznquq-5a.myshopify.com/products/gel-lavant-purifiant-pieds-tea-tree?preview_theme_id=166029000924';

          async function scenario(ctx, flacons) {
            console.log('\n' + '='.repeat(64));
            console.log('SCENARIO :', flacons === null ? 'clic direct, sans toucher au selecteur' : flacons + ' flacon(s) selectionne(s)');
            const p = await ctx.newPage();
            const reqs = [], reps = [], erreurs = [];
            p.on('pageerror', e => erreurs.push('PAGEERROR ' + e.message.slice(0,200)));
            p.on('console', m => { if (m.type() === 'error') erreurs.push('CONSOLE ' + m.text().slice(0,200)); });
            p.on('request', r => { if (r.url().includes('/cart/add')) reqs.push((r.postData() || '').replace(/------WebKit\S*/g, '|').replace(/Content-Disposition: form-data; name=/g, '').replace(/\s+/g, ' ').slice(0, 300)); });
            p.on('response', async r => { if (r.url().includes('/cart/add')) { let t=''; try { t = (await r.text()).slice(0, 300); } catch(e){} reps.push(r.status() + ' :: ' + t); } });

            await p.goto(PRODUIT, { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(5000);

            if (flacons !== null) {
              const ok = await p.evaluate((n) => {
                const radios = [...document.querySelectorAll('input[type="radio"]')].filter(r => String(r.value) === String(n));
                if (!radios.length) return false;
                radios[0].checked = true;
                radios[0].dispatchEvent(new Event('change', { bubbles: true }));
                radios[0].click();
                return true;
              }, flacons);
              console.log('  selection appliquee :', ok);
              await p.waitForTimeout(3000);
            }

            const avant = await p.evaluate(() => {
              const f = document.querySelector('form[action*="/cart/add"]');
              const id = f && f.querySelector('input[name="id"]');
              const q = f && f.querySelector('input[name="quantity"]');
              const btn = document.querySelector('[id^="ProductSubmitButton-"], .main-product-atc');
              return {
                id: id ? String(id.value) : '(absent)',
                quantite: q ? String(q.value) : '(absent)',
                libelle: btn ? btn.innerText.trim() : '(pas de bouton)',
                desactive: btn ? btn.disabled : null,
              };
            });
            console.log('  AVANT CLIC :', JSON.stringify(avant));

            const btn = await p.$('[id^="ProductSubmitButton-"], .main-product-atc');
            await btn.scrollIntoViewIfNeeded();
            await btn.click({ force: true });
            await p.waitForTimeout(7000);

            let apres = { erreurVisible: null, erreurTexte: '(page non lisible)' };
            try {
              apres = await p.evaluate(() => {
                const w = document.querySelector('.product-form__error-message-wrapper');
                const e = document.querySelector('.product-form__error-message');
                return {
                  erreurVisible: w ? !w.hasAttribute('hidden') : null,
                  erreurTexte: e ? e.textContent.trim() : '',
                };
              });
            } catch (err) { console.log('  (lecture page impossible :', err.message.slice(0, 80), ')'); }

            // Le panier est lu hors de la page : insensible a une navigation.
            let j = { item_count: 0, items: [] };
            try {
              const rep = await ctx.request.get('https://kznquq-5a.myshopify.com/cart.js', { headers: { Accept: 'application/json' } });
              j = await rep.json();
            } catch (err) { console.log('  (lecture panier impossible :', err.message.slice(0, 80), ')'); }
            apres.panierArticles = j.item_count;
            apres.panierLignes = (j.items || []).map(i => i.quantity + ' x ' + String(i.title).slice(0, 40));
            apres.url = p.url();
            console.log('  ERREURS JS :', erreurs.length ? erreurs.slice(0,6).join('\n              ') : 'aucune');
            console.log('  REQUETE  :', reqs.join(' | ') || '(aucune)');
            console.log('  REPONSE  :', reps.join(' | ') || '(aucune)');
            console.log('  APRES    :', JSON.stringify(apres));
            const verdict = apres.panierArticles > 0 && !apres.erreurVisible;
            console.log('  VERDICT  :', verdict ? 'OK — article au panier' : 'ECHEC');
            await p.close();
            return verdict;
          }

          (async () => {
            const b = await webkit.launch();
            const resultats = [];
            for (const n of [null, 2]) {
              const ctx = await b.newContext({
                userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
                viewport: { width: 390, height: 844 }, hasTouch: true,
                locale: 'fr-FR', timezoneId: 'Europe/Paris',
              });
              resultats.push([n, await scenario(ctx, n)]);
              await ctx.close();
            }
            console.log('\n' + '='.repeat(64));
            console.log('RESUME');
            resultats.forEach(([n, ok]) => console.log('  ' + (n === null ? 'clic direct' : n + ' flacon(s)') + ' : ' + (ok ? 'OK' : 'ECHEC')));
            await b.close();
            if (resultats.some(([, ok]) => !ok)) process.exit(1);
          })();
          JS
          node achat.js
