name: dom-check
on:
  push:
    paths: ['.github/workflows/dom-check.yml']
  workflow_dispatch:

jobs:
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.48.0
      - run: npx playwright install --with-deps chromium
      - name: Rendre la page comme un mobile et chercher Epuise
        run: |
          cat > check.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
              viewport: { width: 390, height: 844 },
              isMobile: true, hasTouch: true,
            });
            const urls = [
              'https://kznquq-5a.myshopify.com/?og=2',
              'https://kznquq-5a.myshopify.com/products/gel-lavant-purifiant-pieds-tea-tree',
            ];
            for (const url of urls) {
              const p = await ctx.newPage();
              try { await p.goto(url, { waitUntil: 'load', timeout: 60000 }); }
              catch (e) { console.log('GOTO ERREUR:', e.message); }
              await p.waitForTimeout(8000);
              console.log('='.repeat(64));
              console.log('URL:', url);
              const r = await p.evaluate(() => {
                const out = [];
                for (const el of document.querySelectorAll('body *')) {
                  if (el.children.length) continue;
                  const t = (el.textContent || '').trim();
                  if (!/épuis|epuis|rupture|sold\s*out/i.test(t)) continue;
                  const cs = getComputedStyle(el);
                  const bb = el.getBoundingClientRect();
                  out.push({
                    texte: t.slice(0, 70),
                    balise: el.tagName,
                    classe: String(el.className || '').slice(0, 80),
                    visible: bb.width > 0 && bb.height > 0 && cs.display !== 'none' && cs.visibility !== 'hidden' && cs.opacity !== '0',
                  });
                }
                const btn = document.querySelector('.main-product-atc, [id^="ProductSubmitButton-"], .product-form__submit');
                return {
                  bouton: btn ? { texte: btn.innerText.trim().slice(0,70), desactive: btn.disabled } : 'AUCUN BOUTON TROUVE',
                  titre: document.title,
                  occurrences: out,
                };
              });
              console.log('TITRE  :', r.titre);
              console.log('BOUTON :', JSON.stringify(r.bouton));
              console.log('TROUVE :', r.occurrences.length, 'element(s) contenant epuise/rupture');
              console.log(JSON.stringify(r.occurrences, null, 1));
              await p.screenshot({ path: 'shot-' + urls.indexOf(url) + '.png', fullPage: false });
              await p.close();
            }
            await b.close();
          })();
          JS
          node check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: shot-*.png
