name: dom-check
on:
  push:
    paths: ['.github/workflows/dom-check.yml']
  workflow_dispatch:

jobs:
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm i playwright@1.48.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Comparer Safari (webkit) et Chrome (chromium)
        run: |
          cat > check.js <<'JS'
          const pw = require('playwright');
          const URL = 'https://kznquq-5a.myshopify.com/products/gel-lavant-purifiant-pieds-tea-tree';
          (async () => {
            for (const nom of ['webkit', 'chromium']) {
              console.log('\n' + '='.repeat(64));
              console.log('MOTEUR :', nom, nom === 'webkit' ? '(celui de Safari / iPhone)' : '(celui de Chrome)');
              const b = await pw[nom].launch();
              const ctx = await b.newContext({
                userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1',
                viewport: { width: 390, height: 844 },
                isMobile: nom === 'chromium', hasTouch: true,
                locale: 'fr-FR', timezoneId: 'Europe/Paris',
              });
              const p = await ctx.newPage();
              const erreurs = [];
              p.on('pageerror', e => erreurs.push('PAGEERROR: ' + e.message));
              p.on('console', m => { if (m.type() === 'error') erreurs.push('CONSOLE: ' + m.text().slice(0, 160)); });

              try { await p.goto(URL, { waitUntil: 'load', timeout: 60000 }); }
              catch (e) { console.log('GOTO:', e.message); }

              const lire = async (t) => {
                const r = await p.evaluate(() => {
                  const btn = document.querySelector('[id^="ProductSubmitButton-"], .main-product-atc');
                  const lbl = btn && btn.querySelector('.main-atc__label__text');
                  const prix = btn && btn.querySelector('[id^="main-atc-price-"]');
                  const sec = document.querySelector('[id^="SectionAtcBtn-"]');
                  return {
                    label: lbl ? lbl.textContent.trim() : '(pas de label)',
                    prixMasque: prix ? prix.classList.contains('hidden') : null,
                    off: btn ? btn.disabled : null,
                    secondaireOff: sec ? sec.disabled : null,
                    gardePresent: !!document.body.innerHTML.match(/var FAUX/),
                  };
                });
                console.log(`  t=${t}s  label="${r.label}"  bouton_desactive=${r.off}  achat_maintenant_desactive=${r.secondaireOff}  prix_masque=${r.prixMasque}  garde_present=${r.gardePresent}`);
              };

              for (const t of [0.5, 1, 2, 4, 7, 11, 15]) {
                await p.waitForTimeout(t === 0.5 ? 500 : 1000 * (t - (t === 1 ? 0.5 : [0.5,1,2,4,7,11,15][[0.5,1,2,4,7,11,15].indexOf(t)-1])));
                await lire(t);
              }
              console.log('  ERREURS JS :', erreurs.length ? JSON.stringify(erreurs.slice(0, 8), null, 1) : 'aucune');
              await b.close();
            }
          })();
          JS
          node check.js
