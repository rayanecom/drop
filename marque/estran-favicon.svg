<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Estran">
  <title>Estran</title>
  <!-- Favicon. Marge reduite a 3/32 et fut porte a 24 : a 16 px les trois barres
       doivent rester separees, un fut de 22 les refermerait. -->
